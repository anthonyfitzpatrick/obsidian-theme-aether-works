name: Release

# Publishes a GitHub release in the form Obsidian's community theme directory reads:
# tag = manifest.json version, with manifest.json and theme.css attached.
# Runs only when a version tag (x.y.z) is pushed; ordinary pushes never release.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Tag must equal the manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The option snippets ride along as a zip: Obsidian's theme browser installs only
        # manifest.json and theme.css, and the options must work without any plugin.
        run: |
          zip -j aether-works-snippets.zip snippets/*.css
          gh release create "$GITHUB_REF_NAME" manifest.json theme.css aether-works-snippets.zip --title "Aether Works $GITHUB_REF_NAME" --generate-notes
